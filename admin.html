<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b22">
  <title>Admin | Piquenique da Galerinha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Nunito:wght@700;800;900&amp;display=swap" rel="stylesheet">
  <style>
    :root{--green:#235b31;--green2:#3c8346;--cream:#fff8e9;--ink:#173b22;--muted:#6d7d70;--line:#dfe8db;--surface:#fffdf8}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 0 0,#fff4ce,transparent 28%),linear-gradient(145deg,#f7f8f0,#eef4e9);color:var(--ink);font-family:Inter,system-ui,sans-serif}
    button,input{font:inherit}button{cursor:pointer}.page{width:min(1120px,calc(100% - 32px));margin:auto;padding:34px 0 50px}
    header{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:25px}.eyebrow{margin:0 0 6px;color:var(--green2);font-size:11px;font-weight:900;letter-spacing:.14em;text-transform:uppercase}h1{margin:0;font:900 clamp(28px,4vw,42px)/1 Nunito,sans-serif}.subtitle{margin:8px 0 0;color:var(--muted);font-size:14px}
    .export{min-height:44px;padding:0 17px;border:0;border-radius:12px;background:var(--green);color:#fff;font:900 13px Nunito,sans-serif;box-shadow:0 9px 22px rgba(35,91,49,.18)}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:18px}.stat{padding:18px;border:1px solid rgba(35,91,49,.08);border-radius:18px;background:rgba(255,253,248,.9);box-shadow:0 10px 30px rgba(35,91,49,.06)}.stat strong{display:block;font:900 32px Nunito,sans-serif;color:var(--green)}.stat span{color:var(--muted);font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em}
    .panel{padding:20px;border:1px solid rgba(35,91,49,.09);border-radius:22px;background:var(--surface);box-shadow:0 18px 55px rgba(35,91,49,.08)}
    .add{display:grid;grid-template-columns:1fr 1fr auto;gap:10px;margin-bottom:18px}.add input{min-width:0;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:0}.add input:focus{border-color:#81a67b;box-shadow:0 0 0 4px rgba(60,131,70,.1)}.add button{padding:0 18px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;font:900 13px Nunito,sans-serif}
    .toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}.toolbar h2{margin:0;font:900 20px Nunito,sans-serif}.filter{height:38px;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 10px;color:var(--ink)}
    .list{display:grid;gap:8px}.row{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr) auto auto;align-items:center;gap:12px;padding:13px;border:1px solid #e7ede3;border-radius:14px;background:#fff}.row strong,.row small{display:block}.row small{margin-top:3px;color:var(--muted);font-size:10px}.status{padding:7px 9px;border-radius:999px;font-size:9px;font-weight:900;text-transform:uppercase}.confirmed{background:#e0f0dc;color:#276037}.pending{background:#fff0bd;color:#78580a}.action{border:0;border-radius:10px;padding:8px 10px;background:#edf4e8;color:var(--green);font-weight:800;font-size:10px}.empty{text-align:center;color:var(--muted);padding:35px 12px}
    button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid rgba(244,179,33,.55);outline-offset:2px}
    @media(max-width:700px){.page{width:min(100% - 20px,560px);padding-top:20px}header{align-items:flex-start}.export{padding:0 12px}.stats{gap:7px}.stat{padding:13px}.stat strong{font-size:25px}.add{grid-template-columns:1fr}.add button{min-height:44px}.panel{padding:14px}.row{grid-template-columns:minmax(0,1fr) auto}.row>div:nth-child(2){grid-column:1}.status{grid-column:2;grid-row:1}.action{grid-column:2;grid-row:2}}
  </style>
</head>
<body>
  <main class="page">
    <header><div><p class="eyebrow">Área administrativa</p><h1>Lista de presença</h1><p class="subtitle">Gerencie convidados e acompanhe os horários das confirmações.</p></div><button class="export" id="exportCsv" type="button">Exportar CSV</button></header>
    <section class="stats"><div class="stat"><strong id="totalCount">0</strong><span>Total</span></div><div class="stat"><strong id="confirmedCount">0</strong><span>Confirmados</span></div><div class="stat"><strong id="pendingCount">0</strong><span>Pendentes</span></div></section>
    <section class="panel">
      <form class="add" id="guestForm"><input id="guestChild" type="text" placeholder="Nome da criança" required><input id="guestResponsible" type="text" placeholder="Nome do responsável" required><button type="submit">Adicionar convidado</button></form>
      <div class="toolbar"><h2>Convidados</h2><select class="filter" id="statusFilter" aria-label="Filtrar convidados"><option value="all">Todos</option><option value="confirmed">Confirmados</option><option value="pending">Pendentes</option></select></div>
      <div class="list" id="adminList"></div>
    </section>
  </main>
  <script>
    const STORE_KEY='piquenique_convidados';
    const list=document.querySelector('#adminList');
    const getGuests=()=>JSON.parse(localStorage.getItem(STORE_KEY)||'[]');
    const saveGuests=guests=>localStorage.setItem(STORE_KEY,JSON.stringify(guests));
    const formatDate=value=>value?new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(new Date(value)):'Aguardando confirmação';
    function render(){
      const all=getGuests();const filter=document.querySelector('#statusFilter').value;const guests=all.filter(item=>filter==='all'||item.status===filter).sort((a,b)=>a.status===b.status?a.childName.localeCompare(b.childName,'pt-BR'):a.status==='pending'?-1:1);const confirmed=all.filter(item=>item.status==='confirmed').length;
      document.querySelector('#totalCount').textContent=all.length;document.querySelector('#confirmedCount').textContent=confirmed;document.querySelector('#pendingCount').textContent=all.length-confirmed;list.replaceChildren();
      if(!guests.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Nenhum convidado neste filtro.';list.append(empty);return}
      guests.forEach(guest=>{const row=document.createElement('article');row.className='row';const child=document.createElement('div');child.innerHTML='<strong></strong><small></small>';child.querySelector('strong').textContent=guest.childName;child.querySelector('small').textContent=formatDate(guest.confirmedAt);const responsible=document.createElement('div');responsible.innerHTML='<strong></strong><small>Responsável</small>';responsible.querySelector('strong').textContent=guest.responsibleName;const status=document.createElement('span');status.className=`status ${guest.status}`;status.textContent=guest.status==='confirmed'?'Confirmado':'Pendente';const action=document.createElement('button');action.className='action';action.type='button';action.textContent=guest.status==='confirmed'?'Tornar pendente':'Confirmar';action.onclick=()=>{saveGuests(getGuests().map(item=>item.id===guest.id?{...item,status:item.status==='confirmed'?'pending':'confirmed',confirmedAt:item.status==='confirmed'?null:new Date().toISOString()}:item));render()};row.append(child,responsible,status,action);list.append(row)})
    }
    document.querySelector('#guestForm').addEventListener('submit',event=>{event.preventDefault();const childName=document.querySelector('#guestChild').value.trim();const responsibleName=document.querySelector('#guestResponsible').value.trim();if(!childName||!responsibleName)return;const guests=getGuests();guests.push({id:crypto.randomUUID(),childName,responsibleName,status:'pending',confirmedAt:null});saveGuests(guests);event.currentTarget.reset();render()});
    document.querySelector('#statusFilter').addEventListener('change',render);
    document.querySelector('#exportCsv').addEventListener('click',()=>{const quote=value=>`"${String(value??'').replace(/"/g,'""')}"`;const rows=[['Criança','Responsável','Status','Confirmado em'],...getGuests().map(item=>[item.childName,item.responsibleName,item.status==='confirmed'?'Confirmado':'Pendente',item.confirmedAt?formatDate(item.confirmedAt):''])];const blob=new Blob(['\uFEFF'+rows.map(row=>row.map(quote).join(';')).join('\r\n')],{type:'text/csv;charset=utf-8'});const link=document.createElement('a');link.href=URL.createObjectURL(blob);link.download='lista-presenca-piquenique.csv';link.click();URL.revokeObjectURL(link.href)});
    render();
  </script>
</body>
</html>
