<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173b22">
  <title>Admin | Piquenique da Galerinha</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <style>
    :root{--green:#235b31;--green2:#3c8346;--cream:#fff8e9;--ink:#173b22;--muted:#6d7d70;--line:#dfe8db;--surface:#fffdf8}
    *{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(circle at 0 0,#fff4ce,transparent 28%),linear-gradient(145deg,#f7f8f0,#eef4e9);color:var(--ink);font-family:Inter,system-ui,sans-serif;font-weight:400;-webkit-font-smoothing:antialiased}
    button,input{font:inherit}button{cursor:pointer}.page{width:min(1040px,calc(100% - 40px));margin:auto;padding:36px 0 52px}
    header{position:relative;display:flex;align-items:center;justify-content:center;gap:20px;margin-bottom:24px;text-align:center}.header-copy{max-width:680px}.eyebrow{margin:0 0 7px;color:var(--green2);font-size:11px;font-weight:600;letter-spacing:.13em;text-transform:uppercase}h1{margin:0;font-size:clamp(28px,4vw,38px);line-height:1.15;font-weight:600;letter-spacing:-.035em}.subtitle{margin:9px 0 0;color:var(--muted);font-size:14px;line-height:1.55}
    .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;max-width:780px;margin:0 auto 18px}.stat{min-height:98px;display:grid;place-content:center;text-align:center;gap:5px;padding:16px;border:1px solid rgba(35,91,49,.08);border-radius:16px;background:rgba(255,253,248,.92);box-shadow:0 8px 24px rgba(35,91,49,.05)}.stat strong{display:block;color:var(--green);font-size:30px;line-height:1.1;font-weight:600;font-variant-numeric:tabular-nums}.stat span{color:var(--muted);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.09em}
    .panel{padding:22px;border:1px solid rgba(35,91,49,.09);border-radius:20px;background:var(--surface);box-shadow:0 16px 44px rgba(35,91,49,.07)}
    .add{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;gap:10px;margin-bottom:22px}.add input{min-width:0;height:48px;padding:0 14px;border:1px solid var(--line);border-radius:11px;background:#fff;color:var(--ink);font-size:14px;outline:0}.add input::placeholder{color:#7c877e}.add input:focus{border-color:#81a67b;box-shadow:0 0 0 4px rgba(60,131,70,.1)}.add button{min-height:48px;padding:0 17px;border:0;border-radius:11px;background:linear-gradient(135deg,var(--green2),var(--green));color:#fff;font-size:13px;font-weight:600}
    .toolbar{display:flex;align-items:center;justify-content:center;margin-bottom:12px;text-align:center}.toolbar h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-.02em}
    .list{display:grid;gap:9px}.row{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto auto;align-items:center;gap:14px;padding:14px 16px;border:1px solid #e7ede3;border-radius:13px;background:#fff}.row strong,.row small{display:block}.row strong{font-size:14px;font-weight:500;line-height:1.4;overflow-wrap:anywhere}.row small{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}.status{padding:7px 9px;border-radius:999px;font-size:9px;font-weight:600;text-transform:uppercase;letter-spacing:.035em;white-space:nowrap}.confirmed{background:#e0f0dc;color:#276037}.pending{background:#fff0bd;color:#78580a}.action{min-height:34px;border:0;border-radius:9px;padding:0 11px;background:#edf4e8;color:var(--green);font-weight:500;font-size:11px;white-space:nowrap}.empty{text-align:center;color:var(--muted);padding:35px 12px;font-size:14px}
    button:focus-visible,input:focus-visible{outline:3px solid rgba(244,179,33,.55);outline-offset:2px}
    @media(max-width:700px){.page{width:min(100% - 24px,560px);padding:24px 0 36px}header{display:grid;gap:12px;margin-bottom:20px}.subtitle{font-size:13px}.stats{gap:9px;margin-bottom:14px}.stat{min-height:86px;padding:12px}.stat strong{font-size:26px}.panel{padding:16px;border-radius:17px}.add{grid-template-columns:1fr;gap:9px;margin-bottom:20px}.add input{height:46px}.add button{min-height:46px}.row{grid-template-columns:minmax(0,1fr) auto;gap:10px 12px;padding:13px}.row>div:nth-child(2){grid-column:1}.status{grid-column:2;grid-row:1;justify-self:end}.action{grid-column:2;grid-row:2;justify-self:end}}
    @media(max-width:360px){.page{width:calc(100% - 18px)}.stat{padding:10px}.panel{padding:12px}.row{gap:9px;padding:11px}.action{padding:0 8px;font-size:10px}}
  
    .actions{display:flex;gap:7px;align-items:center}.delete-action{background:#fff0ef;color:#a13b35}.delete-action:hover{background:#ffe3e0}
  </style>
</head>
<body>
  <main class="page" id="adminView">
    <header><div class="header-copy"><p class="eyebrow">Área administrativa</p><h1>Lista de presença</h1></div></header>
    <section class="stats"><div class="stat"><strong id="totalCount">0</strong><span>Total de convidados</span></div><div class="stat"><strong id="confirmedCount">0</strong><span>Presenças confirmadas</span></div></section>
    <section class="panel">
      <form class="add" id="guestForm"><input id="guestChild" type="text" placeholder="Nome da criança" required><input id="guestResponsible" type="text" placeholder="Nome do responsável" required><button type="submit">Adicionar convidado</button></form>
      <div class="toolbar"><h2>Convidados</h2></div>
      <div class="list" id="adminList"></div>
    </section>
  </main>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore-compat.js"></script>
  <script src="config.js"></script>
  <script>
    firebase.initializeApp(firebaseConfig);

    const db = firebase.firestore();
    const list = document.querySelector('#adminList');
    let cachedGuests = [];
    let unsubGuests = null;
    let unsubConfirmations = null;
    let guestRows = [];
    let confirmationRows = [];

    const normalize=value=>String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim().toLowerCase().replace(/\s+/g,' ');
    const formatDate=value=>{
      if(!value) return 'Aguardando confirmação';
      const date=value.toDate ? value.toDate() : new Date(value);
      return new Intl.DateTimeFormat('pt-BR',{dateStyle:'short',timeStyle:'short'}).format(date);
    };

    function rebuildCache(){
      const confirmationsByKey=new Map();
      confirmationRows.forEach(item=>{
        const key=`${normalize(item.childName)}|${normalize(item.responsibleName)}`;
        const prev=confirmationsByKey.get(key);
        const time=item.confirmedAt?.toMillis?.() || 0;
        const prevTime=prev?.confirmedAt?.toMillis?.() || 0;
        if(!prev || time>=prevTime) confirmationsByKey.set(key,item);
      });

      const guestKeys=new Set();
      const merged=guestRows.map(item=>{
        const key=`${normalize(item.childName)}|${normalize(item.responsibleName)}`;
        guestKeys.add(key);
        const confirmation=confirmationsByKey.get(key);
        if(confirmation){
          return {...item,status:'confirmed',confirmedAt:confirmation.confirmedAt,confirmationId:confirmation.id};
        }
        return item;
      });

      confirmationsByKey.forEach((confirmation,key)=>{
        if(!guestKeys.has(key)) merged.push({
          id:`confirmation:${confirmation.id}`,
          confirmationId:confirmation.id,
          childName:confirmation.childName,
          responsibleName:confirmation.responsibleName,
          status:'confirmed',
          confirmedAt:confirmation.confirmedAt,
          fromConfirmation:true
        });
      });

      cachedGuests=merged;
      render();
    }

    function render(){
      const all=cachedGuests;
      const guests=[...all].sort((a,b)=>a.status===b.status?a.childName.localeCompare(b.childName,'pt-BR'):a.status==='pending'?-1:1);
      const confirmed=all.filter(item=>item.status==='confirmed').length;
      document.querySelector('#totalCount').textContent=all.length;
      document.querySelector('#confirmedCount').textContent=confirmed;
      list.replaceChildren();
      if(!guests.length){const empty=document.createElement('div');empty.className='empty';empty.textContent='Nenhum convidado cadastrado.';list.append(empty);return}
      guests.forEach(guest=>{
        const row=document.createElement('article');row.className='row';
        const child=document.createElement('div');child.innerHTML='<strong></strong><small></small>';child.querySelector('strong').textContent=guest.childName;child.querySelector('small').textContent=formatDate(guest.confirmedAt);
        const responsible=document.createElement('div');responsible.innerHTML='<strong></strong><small>Responsável</small>';responsible.querySelector('strong').textContent=guest.responsibleName;
        const status=document.createElement('span');status.className=`status ${guest.status}`;status.textContent=guest.status==='confirmed'?'Confirmado':'Pendente';
        const actions=document.createElement('div');actions.className='actions';
        let action=null;
        if(guest.status!=='confirmed'){
          action=document.createElement('button');action.className='action';action.type='button';action.textContent='Confirmar';
          action.onclick=async()=>{
            try{
              await db.collection('guests').doc(guest.id).set({status:'confirmed',confirmedAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true});
              guestRows=guestRows.map(item=>item.id===guest.id?{...item,status:'confirmed',confirmedAt:new Date()}:item);
              rebuildCache();
            }catch(error){alert('Não foi possível atualizar.');console.error(error)}
          };
        }
        const del=document.createElement('button');del.className='action delete-action';del.type='button';del.textContent='Excluir';
        del.onclick=async()=>{
          if(!confirm(`Excluir ${guest.childName} da lista?`)) return;
          try{
            const jobs=[];
            if(guest.confirmationId) jobs.push(db.collection('confirmations').doc(guest.confirmationId).delete());
            if(!guest.fromConfirmation && !String(guest.id).startsWith('confirmation:')) jobs.push(db.collection('guests').doc(guest.id).delete());
            await Promise.all(jobs);
          }catch(error){alert('Não foi possível excluir o convidado.');console.error(error)}
        };
        if(action) actions.append(action);
        actions.append(del);
        row.append(child,responsible,status,actions);list.append(row);
      });
    }

    function startRealtime(){
      stopRealtime();
      unsubGuests=db.collection('guests').orderBy('createdAt','asc').onSnapshot(snapshot=>{
        guestRows=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
        rebuildCache();
      },error=>{console.error(error);list.innerHTML='<div class="empty">Erro ao carregar convidados.</div>'});
      unsubConfirmations=db.collection('confirmations').orderBy('createdAt','asc').onSnapshot(snapshot=>{
        confirmationRows=snapshot.docs.map(doc=>({id:doc.id,...doc.data()}));
        rebuildCache();
      },error=>console.error(error));
    }

    function stopRealtime(){
      if(unsubGuests){unsubGuests();unsubGuests=null}
      if(unsubConfirmations){unsubConfirmations();unsubConfirmations=null}
    }

    document.querySelector('#guestForm').addEventListener('submit',async event=>{
      event.preventDefault();
      const childName=document.querySelector('#guestChild').value.trim();
      const responsibleName=document.querySelector('#guestResponsible').value.trim();
      if(!childName||!responsibleName)return;
      try{
        await db.collection('guests').add({childName,responsibleName,status:'pending',confirmedAt:null,createdAt:firebase.firestore.FieldValue.serverTimestamp(),updatedAt:firebase.firestore.FieldValue.serverTimestamp()});
        event.currentTarget.reset();
      }catch(error){alert('Não foi possível adicionar.');console.error(error)}
    });

    startRealtime();
  </script>
</body>
</html>
